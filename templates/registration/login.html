<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión Académica</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
        }
        .btn-primary {
            background-color: #3f51b5;
            border-color: #3f51b5;
            border-radius: 8px;
            padding: 10px 24px;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #303f9f;
            border-color: #303f9f;
        }
        .text-accent {
            color: #3f51b5;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <h2 class="text-accent fw-bold">Antigravity</h2>
            <p class="text-muted">Gestión de Cursos Académicos</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger rounded-3 small">
                Usuario o contraseña incorrectos. Por favor intente de nuevo.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            
            <div class="mb-3">
                <label for="id_username" class="form-label fw-bold small text-uppercase text-muted">Usuario</label>
                <input type="text" name="username" autofocus autofocus required id="id_username" class="form-control form-control-lg" placeholder="Ingrese su usuario">
            </div>
            
            <div class="mb-4">
                <label for="id_password" class="form-label fw-bold small text-uppercase text-muted">Contraseña</label>
                <input type="password" name="password" required id="id_password" class="form-control form-control-lg" placeholder="Ingrese su contraseña">
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-2">Ingresar</button>
            <p class="text-center text-muted small mt-3 mb-0">Utilice sus credenciales administrativas</p>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
